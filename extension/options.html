<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>FlirtyAI · Settings</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body { background: #0a0a0f; color: #f5f5f7; min-height: 100vh; }
    .options-app input[type="text"] { width: 100%; }
  </style>
</head>
<body>
  <div class="options-app">
    <h1>FlirtyAI · Settings</h1>
    <p>Point the extension at your FlirtyAI backend (running locally or deployed) and set your texting persona.</p>

    <label class="row">
      <span>Backend URL</span>
      <input id="backend" type="text" placeholder="http://localhost:3000" />
    </label>

    <label class="row" style="margin-top:14px">
      <span>Your texting persona <em>(saved on this device)</em></span>
      <textarea id="persona" placeholder='e.g. "lowercase, dry humor, almost no emojis"'></textarea>
    </label>

    <button id="save" class="primary save">Save</button>
    <span id="saved" class="saved hidden">✓ Saved</span>

    <p style="margin-top:24px; font-size: 11px;">
      Tip: when developing locally, the backend URL is <code>http://localhost:3000</code>. When you deploy to Vercel, paste the public URL here.
    </p>
  </div>

  <script src="options.js"></script>
</body>
</html>
